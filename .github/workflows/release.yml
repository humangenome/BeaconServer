name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build BeaconServer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet
        run: dotnet restore BeaconServer.sln

      - name: Build
        run: dotnet build BeaconServer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BeaconServer.sln --configuration Release --no-build --verbosity normal

      # Proves the published source builds. The output is deliberately NOT
      # attached to the release: this repo carries the supervisor source only,
      # so anything it can zip is a supervisor-only artifact. Publishing that
      # under the release's server-zip name is what put a runtime-less zip on
      # a run of older release pages. The complete bundle -- supervisor plus
      # the UE4SS runtime and the Beacon server mods -- is built once, in the
      # Beacon build, and attached to this release from there.
      - name: Publish BeaconServer (self-contained)
        run: dotnet publish src/server/BeaconServer/BeaconServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false

      - name: Extract changelog section
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## |\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md has no '## [$version]' section. Add one before tagging — a release body that points at a missing changelog section is worse than no release."
          }
          $notes = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "CHANGELOG.md section '## [$version]' is empty. Write the release notes before tagging."
          }
          $hostingUrl = "https://www.survivalservers.com/services/game_servers/subnautica_2/?utm_source=github&utm_medium=release_notes&utm_campaign=beaconserver-$version"
          $hosting = "`n`n---`n`nHosting: [SurvivalServers.com]($hostingUrl) runs Beacon for you.`n"
          $body = $notes + $hosting
          $body | Out-File -FilePath release-body.md -Encoding utf8

      - name: Create GitHub release (BeaconServer)
        uses: softprops/action-gh-release@v2
        with:
          # HUMANGENOME_PAT so the release object is authored by the account,
          # not github-actions[bot]. Falls back to GITHUB_TOKEN if the secret
          # is ever removed — the release still publishes, only the author
          # byline degrades.
          token: ${{ secrets.HUMANGENOME_PAT || secrets.GITHUB_TOKEN }}
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Fail-closed backstop. The release page is only correct once the full bundle
  # is attached to it, and that attachment happens from the Beacon build. If it
  # never arrives -- a missing cross-publish token, a tag pushed here on its own
  # -- this job fails loudly instead of leaving a release that looks finished
  # and hands self-hosters a server that players bounce straight off.
  verify-bundle:
    name: Verify the published server bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for the bundle and verify it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ASSET="Beacon-Server-Windows-x64-${TAG}.zip"

          found=""
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" -R "${{ github.repository }}" \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
              found=1
              break
            fi
            echo "waiting for $ASSET to be attached to $TAG (attempt $attempt/20)"
            sleep 30
          done

          if [[ -z "$found" ]]; then
            echo "ERROR: $TAG has no $ASSET after 10 minutes." >&2
            echo "       The server bundle is built in the Beacon build and attached from there." >&2
            echo "       Check that the cross-publish step ran and had a token." >&2
            exit 1
          fi

          gh release download "$TAG" -R "${{ github.repository }}" -p "$ASSET" -D verify --clobber
          python3 scripts/verify-server-bundle.py "verify/$ASSET"
